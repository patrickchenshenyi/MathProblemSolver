# profile patch（web profile 的 user layer，加载本项目插件）。
# 由 setup.sh 复制到 $DSH_HOME/profiles/web/cordis.patch.yml。
# 与工坊实例（deepseek-harness-aimo + ~/.dsh-build）实测结构一致，2026-09-28 同步。

# M1.5：用容器后端替换 base 的 worker-thread 代码运行时。
# ctx.codeRuntime 是单例服务，必须先禁用 base 的 code-runtime 行，再插入 docker provider。
- id: code-runtime
  disabled: true

# M2：Agent Teams 共享任务板（DAG）+ 其模型工具。
- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 16

- insert:
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'

# 本项目插件（5 个）
- insert:
    - id: aimo-code-runtime-docker
      name: '@deepseek-ai/dsh-aimo-code-runtime-docker'

- insert:
    - id: aimo-python
      name: '@deepseek-ai/dsh-aimo-python'

# 答案范围可按部署调整：默认 [0, 99999] 覆盖 AIME（3 位）与 AIMO3（mod 10^5，5 位）。
- insert:
    - id: aimo-verifier
      name: '@deepseek-ai/dsh-aimo-verifier'
      config:
        answerMin: 0
        answerMax: 99999

# Phase 1：按角色硬隔离工具面（lead / solver / critic；未知角色 fail-closed）。
# 必须排在 aimo-verifier 与 tool-agent-team 之后加载。
- insert:
    - id: aimo-team-roles
      name: '@deepseek-ai/dsh-aimo-team-roles'

# Phase 3-T9：池化调度（claim_next_task）+ T4 任务分解（decompose_task）。
- insert:
    - id: aimo-pool
      name: '@deepseek-ai/dsh-aimo-pool'
      config:
        maxCopiesPerGroup: 3
        maxChildren: 5
        maxDepth: 3
